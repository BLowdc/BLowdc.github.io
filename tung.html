<!DOCTYPE html>
<html>
<head>
    <title>OCR Exam Form Practice</title>
    <style>
        h1 {
            color: rgb(194, 140, 41);
        }
        
        .sub {
            background-color: lime;
        }

        #main {
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
    </style>
</head>

<body>
    <h1>
        History of tung tung tung sahur
    </h1>

    <h2 id="main">
        It wansn't always 3 tungs...
    </h2>

    <p class="sub">
        Real ones know it's 9 tungs
    </p>

    <!-- 1. THE FORM CONTAINER -->
    <form id="loginForm">
        <!-- 2. THE TEXT INPUT -->
        <label>Enter Username:</label><br>
        <input type="text" placeholder="Enter here" name="username" id="userInput">

        <!-- 3. THE SUBMIT BUTTON -->
        <input type="submit" value="Submit">
    </form>

    <!-- 4. THE SCRIPT TAG -->
    <script>
        // JavaScript logic goes inside here
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Stops the page from refreshing
            
            // Get the value from the input field
            let name = document.getElementById("userInput").value;
            alert("Hello, " + name + "! Form submitted successfully.");
        });
    </script>

</body>
</html>
